services:
  dashboard-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: homelab-dashboard-api
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Agent poll timeout, and how long a slow/dropped poll keeps serving
      # the last good snapshot (flagged stale) before "agent unreachable".
      AGENT_POLL_TIMEOUT: ${AGENT_POLL_TIMEOUT:-}
      AGENT_STALE_GRACE: ${AGENT_STALE_GRACE:-}
      # API_TOKEN is the new name; REGISTER_TOKEN still works as an alias.
      API_TOKEN: ${API_TOKEN:-${REGISTER_TOKEN:-}}
      MAIN_HOST: ${MAIN_HOST:-}
      # Sent as X-Agent-Token to agents that set AGENT_TOKEN. Needed for the
      # Deploy tab to create/remove containers on token-protected agents.
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      # Rebalancing suggestion thresholds (GET /api/rebalance). Defaults
      # apply if unset.
      REBALANCE_CPU_PERCENT: ${REBALANCE_CPU_PERCENT:-}
      REBALANCE_RAM_PERCENT: ${REBALANCE_RAM_PERCENT:-}
      REBALANCE_MIN_GAIN: ${REBALANCE_MIN_GAIN:-}
      # Set AUTO_REBALANCE=1 to let the backend perform qualifying moves
      # itself. The rest tune its caution; defaults apply if unset.
      AUTO_REBALANCE: ${AUTO_REBALANCE:-}
      AUTO_REBALANCE_INTERVAL: ${AUTO_REBALANCE_INTERVAL:-}
      AUTO_REBALANCE_MIN_GAIN: ${AUTO_REBALANCE_MIN_GAIN:-}
      AUTO_REBALANCE_COOLDOWN: ${AUTO_REBALANCE_COOLDOWN:-}
      AUTO_REBALANCE_MAX_PER_CYCLE: ${AUTO_REBALANCE_MAX_PER_CYCLE:-}
      # Alerting: set ALERT_WEBHOOK_URL to turn it on. The backend POSTs a
      # small JSON body there when a host goes offline, RAM/CPU sits over
      # threshold, or a managed deployment fails — and again on recovery.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_RAM_PERCENT: ${ALERT_RAM_PERCENT:-}
      ALERT_CPU_PERCENT: ${ALERT_CPU_PERCENT:-}
      ALERT_INTERVAL: ${ALERT_INTERVAL:-}
      ALERT_BREACH_CYCLES: ${ALERT_BREACH_CYCLES:-}
      # Disk / temperature / container / backup rules (also drive the
      # Overview Attention panel). Defaults apply if unset.
      ALERT_DISK_PERCENT: ${ALERT_DISK_PERCENT:-}
      ALERT_DISK_CRITICAL_PERCENT: ${ALERT_DISK_CRITICAL_PERCENT:-}
      ALERT_DISK_FORECAST_DAYS: ${ALERT_DISK_FORECAST_DAYS:-}
      DISK_FORECAST_WINDOW: ${DISK_FORECAST_WINDOW:-}
      ALERT_TEMP_CELSIUS: ${ALERT_TEMP_CELSIUS:-}
      ALERT_RESTART_COUNT: ${ALERT_RESTART_COUNT:-}
      ALERT_RESTART_WINDOW_MINUTES: ${ALERT_RESTART_WINDOW_MINUTES:-}
      ALERT_BACKUP_MAX_AGE_HOURS: ${ALERT_BACKUP_MAX_AGE_HOURS:-}
      # Service checks (Services tab): failures in a row before "down", and
      # how many probes may run at once. Defaults apply if unset.
      CHECK_FAILURES_BEFORE_DOWN: ${CHECK_FAILURES_BEFORE_DOWN:-}
      CHECK_WORKERS: ${CHECK_WORKERS:-}
      # Live "currently in use" badges for qBittorrent / Jellyfin
      # containers. Leave unset to skip probing that app.
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
    volumes:
      - dashboard-data:/data
    # Lets the backend send unprivileged ICMP echo (Ping checks) without
    # granting any extra capability.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    networks:
      - dashboard
      - prometheus_net

  dashboard-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - dashboard-api
    networks:
      - dashboard

networks:
  dashboard:

  prometheus_net:
    external: true
    name: prometheus_default

volumes:
  dashboard-data:
