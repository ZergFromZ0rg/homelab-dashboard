services:
  dashboard-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: homelab-dashboard-api
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      # API_TOKEN is the new name; REGISTER_TOKEN still works as an alias.
      API_TOKEN: ${API_TOKEN:-${REGISTER_TOKEN:-}}
      MAIN_HOST: ${MAIN_HOST:-}
      # Optional: enables the scheduler's natural-language constraint
      # parsing and placement explanations. Unset = deterministic scoring
      # only, everything still works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Sent as X-Agent-Token to agents that set AGENT_TOKEN. Needed for the
      # Deploy tab to create/remove containers on token-protected agents.
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      # Rebalancing suggestion thresholds (GET /api/rebalance). Defaults
      # apply if unset.
      REBALANCE_CPU_PERCENT: ${REBALANCE_CPU_PERCENT:-}
      REBALANCE_RAM_PERCENT: ${REBALANCE_RAM_PERCENT:-}
      REBALANCE_MIN_GAIN: ${REBALANCE_MIN_GAIN:-}
      # Set AUTO_REBALANCE=1 to let the backend perform qualifying moves
      # itself. The rest tune its caution; defaults apply if unset.
      AUTO_REBALANCE: ${AUTO_REBALANCE:-}
      AUTO_REBALANCE_INTERVAL: ${AUTO_REBALANCE_INTERVAL:-}
      AUTO_REBALANCE_MIN_GAIN: ${AUTO_REBALANCE_MIN_GAIN:-}
      AUTO_REBALANCE_COOLDOWN: ${AUTO_REBALANCE_COOLDOWN:-}
      AUTO_REBALANCE_MAX_PER_CYCLE: ${AUTO_REBALANCE_MAX_PER_CYCLE:-}
    volumes:
      - dashboard-data:/data
    networks:
      - dashboard
      - prometheus_net

  dashboard-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - dashboard-api
    networks:
      - dashboard

networks:
  dashboard:

  prometheus_net:
    external: true
    name: prometheus_default

volumes:
  dashboard-data:
